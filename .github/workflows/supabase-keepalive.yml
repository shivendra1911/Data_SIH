name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent Supabase free project auto-pause
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -f -H "apikey: sb_publishable_sqCaR-QnTPSE2PVW3FmCtg_AKwBWJpN" \
            -H "Authorization: Bearer sb_publishable_sqCaR-QnTPSE2PVW3FmCtg_AKwBWJpN" \
            "https://nratutjgjodkbysxyxem.supabase.co/rest/v1/sos_alerts?limit=1" > /dev/null
          echo "Supabase successfully pinged to maintain 24/7 project activity."
